name: CI

permissions:
  contents: read

on:
  push:
      branches: [main]
  pull_request:
      branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - xcode: "26.5"
            deployment_target: ""
    runs-on:  macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: ./other/download_libs.sh $DOWNLOAD_LIBS_ARGS
        env:
          DOWNLOAD_LIBS_ARGS: ${{ github.event_name == 'pull_request' && '--skip-plugins' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: xcodebuild -project uniplayer.xcodeproj ONLY_ACTIVE_ARCH=NO -scheme uniplayer -derivedDataPath . -configuration Nightly ${{ matrix.deployment_target }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Create DMG
        run: hdiutil create -volname "UniPlayer Nightly" -srcfolder Build/Products/Nightly/UniPlayer.app -ov -format UDZO UniPlayer.dmg

      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: UniPlayer
          path: UniPlayer.dmg
          archive: false

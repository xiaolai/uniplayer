name: CI

permissions:
  contents: read

on:
  push:
      branches: [main]
  pull_request:
      branches: [main]

jobs:
  build:
    # The product targets macOS 27; GitHub's published Xcode 27 image is
    # `xcode-27` (arm64). There is no `macos-27` hosted label.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Check design tokens
        run: python3 scripts/check-design-tokens.py --ledger

      - name: Test the design-token checker
        run: python3 -m unittest scripts/test_check_design_tokens.py

      - name: Test release automation without credentials
        run: python3 -m unittest scripts/test_github_release.py scripts/test_release_signing.py

      - name: Validate browser extensions
        run: python3 scripts/validate-browser-extensions.py

      - name: Install dependencies
        run: |
          if [[ -n "$DOWNLOAD_LIBS_ARGS" ]]; then
            ./other/download_libs.sh "$DOWNLOAD_LIBS_ARGS"
          else
            ./other/download_libs.sh
          fi
        env:
          DOWNLOAD_LIBS_ARGS: ${{ github.event_name == 'pull_request' && '--skip-plugins' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: xcodebuild -project uniplayer.xcodeproj -scheme uniplayer -derivedDataPath . -configuration Debug CODE_SIGNING_ALLOWED=NO test

      - name: Build
        run: xcodebuild -project uniplayer.xcodeproj ONLY_ACTIVE_ARCH=NO -scheme uniplayer -derivedDataPath . -configuration Nightly

      - name: Create DMG
        run: hdiutil create -volname "UniPlayer Nightly" -srcfolder Build/Products/Nightly/UniPlayer.app -ov -format UDZO UniPlayer.dmg

      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: UniPlayer
          path: UniPlayer.dmg
          archive: false

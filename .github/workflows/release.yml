name: Release macOS

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to release or resume (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

# Serialize release publication, tap update and retention.
# Do not cancel an in-flight publication when another tag arrives.
concurrency:
  group: uniplayer-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'xiaolai/uniplayer'
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: ${{ vars.RELEASE_DEVELOPER_DIR || '/Applications/Xcode_27.1.app/Contents/Developer' }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set temporary paths
        run: |
          printf 'RELEASE_OUTPUT=%s/uniplayer-release\nSIGNING_STATE=%s/uniplayer-signing-state.json\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Validate tag, ancestry, credentials and publication state
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/github_release.py prepare --tag "$RELEASE_TAG"

      - name: Check fresh-build signing configuration
        if: steps.prepare.outputs.published != 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: python3 scripts/release_signing.py check

      - name: Verify Xcode and macOS SDK
        if: steps.prepare.outputs.published != 'true'
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          python3 - <<'PY'
          import subprocess
          xcode = subprocess.check_output(['xcodebuild', '-version'], text=True).splitlines()[0].split()[1]
          sdk = subprocess.check_output(['xcrun', '--sdk', 'macosx', '--show-sdk-version'], text=True).strip()
          if tuple(map(int, xcode.split('.')[:2])) < (27, 1) or int(sdk.split('.')[0]) < 27:
              raise SystemExit('Release requires Xcode 27.1+ and macOS SDK 27+')
          PY

      - name: Run static and release-automation gates
        if: steps.prepare.outputs.published != 'true'
        run: |
          set -euo pipefail
          python3 scripts/check-design-tokens.py --ledger
          python3 -m unittest scripts/test_check_design_tokens.py scripts/test_github_release.py scripts/test_release_signing.py
          python3 scripts/validate-browser-extensions.py
          plutil -lint uniplayer/Info.plist uniplayer/Base.lproj/Localizable.strings uniplayer/en.lproj/Localizable.strings
          git diff --exit-code

      - name: Download locked universal dependencies
        if: steps.prepare.outputs.published != 'true'
        run: ./other/download_libs.sh

      - name: Test the tagged application
        if: steps.prepare.outputs.published != 'true'
        run: >-
          xcodebuild -project uniplayer.xcodeproj -scheme uniplayer
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/UniPlayerTests"
          CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO test

      - name: Import temporary signing material
        id: signing
        if: steps.prepare.outputs.published != 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: python3 scripts/release_signing.py setup --state "$SIGNING_STATE"

      # Signing secrets do not enter this step or Xcode's environment.
      - name: Build, sign, notarize, staple and verify
        if: steps.prepare.outputs.published != 'true'
        env:
          BUILD_NUMBER: ${{ steps.prepare.outputs.build }}
          NOTARY_PROFILE: ${{ steps.signing.outputs.profile }}
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          set -euo pipefail
          python3 scripts/release-macos.py --build "$BUILD_NUMBER" --profile "$NOTARY_PROFILE" --keychain "$SIGNING_KEYCHAIN" --output "$RELEASE_OUTPUT"
          python3 scripts/github_release.py manifest --tag "$RELEASE_TAG" --directory "$RELEASE_OUTPUT"

      - name: Restore keychain search list and remove signing material
        if: always() && steps.signing.outcome != 'skipped' && steps.signing.outcome != ''
        run: python3 scripts/release_signing.py cleanup --state "$SIGNING_STATE"

      - name: Retain verified build artifacts for one day
        if: success() && steps.prepare.outputs.published != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: uniplayer-release-${{ steps.prepare.outputs.version }}-${{ github.run_attempt }}
          path: |
            ${{ env.RELEASE_OUTPUT }}/UniPlayer-*-universal.dmg
            ${{ env.RELEASE_OUTPUT }}/SHA256SUMS.txt
            ${{ env.RELEASE_OUTPUT }}/release-manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish, update Homebrew and retain only the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 scripts/github_release.py publish --tag "$RELEASE_TAG" --directory "$RELEASE_OUTPUT"
